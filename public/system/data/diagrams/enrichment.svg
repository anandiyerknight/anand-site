<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Geist, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="675" fill="#0a0a0a"/>
  <text x="64" y="74" fill="#8e9192" font-size="15" letter-spacing="4" font-weight="600">DATA ENRICHMENT</text>
  <text x="64" y="108" fill="#f5f5f7" font-size="30" font-weight="700">From a raw list to a qualified, ranked ICP.</text>

  <!-- card 1: scraped -->
  <g>
    <rect x="64" y="170" width="300" height="380" rx="16" fill="#0e0e0e" stroke="#353535"/>
    <text x="88" y="212" fill="#8e9192" font-size="13" letter-spacing="2">01 · SCRAPED CONTACTS</text>
    <g fill="#444748">
      <rect x="88" y="240" width="160" height="12" rx="6" fill="#5a5d5f"/>
      <rect x="88" y="262" width="110" height="10" rx="5"/>
      <rect x="88" y="300" width="160" height="12" rx="6" fill="#5a5d5f"/>
      <rect x="88" y="322" width="90" height="10" rx="5"/>
      <rect x="88" y="360" width="160" height="12" rx="6" fill="#5a5d5f"/>
      <rect x="88" y="382" width="120" height="10" rx="5"/>
      <rect x="88" y="420" width="160" height="12" rx="6" fill="#5a5d5f"/>
      <rect x="88" y="442" width="80" height="10" rx="5"/>
    </g>
    <text x="88" y="510" fill="#8e9192" font-size="13">name only · gaps everywhere</text>
  </g>

  <!-- arrow -->
  <g stroke="#8e9192" stroke-width="2" fill="none">
    <path d="M384 360 H452" marker-end="url(#a)"/>
  </g>

  <!-- card 2: enrich -->
  <g>
    <rect x="466" y="170" width="268" height="380" rx="16" fill="#0e0e0e" stroke="#353535"/>
    <text x="490" y="212" fill="#8e9192" font-size="13" letter-spacing="2">02 · ENRICH + SCORE</text>
    <g fill="#f5f5f7" font-size="16">
      <text x="490" y="256">+ Role &amp; seniority</text>
      <text x="490" y="296">+ Company &amp; size</text>
      <text x="490" y="336">+ Verified email</text>
      <text x="490" y="376">+ Intent signals</text>
      <text x="490" y="416">+ Fit score</text>
    </g>
    <text x="490" y="510" fill="#8e9192" font-size="13">append · verify · rank</text>
  </g>

  <!-- arrow -->
  <g stroke="#8e9192" stroke-width="2" fill="none">
    <path d="M734 360 H802" marker-end="url(#a)"/>
  </g>

  <!-- card 3: qualified -->
  <g>
    <rect x="816" y="170" width="320" height="380" rx="16" fill="#101010" stroke="#5a5d5f"/>
    <text x="840" y="212" fill="#f5f5f7" font-size="13" letter-spacing="2">03 · QUALIFIED ICP LIST</text>
    <g>
      <rect x="840" y="238" width="272" height="48" rx="8" fill="#161616" stroke="#353535"/>
      <rect x="840" y="296" width="272" height="48" rx="8" fill="#161616" stroke="#353535"/>
      <rect x="840" y="354" width="272" height="48" rx="8" fill="#161616" stroke="#353535"/>
      <rect x="840" y="412" width="272" height="48" rx="8" fill="#161616" stroke="#353535"/>
    </g>
    <g fill="#e2e2e2" font-size="13">
      <text x="856" y="268">Founder · D2C · 50 ppl ·  92</text>
      <text x="856" y="326">VP Growth · SaaS · 200 ·  88</text>
      <text x="856" y="384">Owner · Clinic · 12 ·  81</text>
      <text x="856" y="442">CMO · Retail · 400 ·  76</text>
    </g>
    <text x="840" y="510" fill="#8e9192" font-size="13">ready to message · highest fit first</text>
  </g>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#8e9192"/></marker>
