<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Geist, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="675" fill="#0a0a0a"/>
  <text x="64" y="74" fill="#8e9192" font-size="15" letter-spacing="4" font-weight="600">OUTREACH · SEQUENCE</text>
  <text x="64" y="108" fill="#f5f5f7" font-size="30" font-weight="700">A multi-touch sequence that never forgets a follow-up.</text>

  <!-- timeline -->
  <line x1="120" y1="360" x2="1080" y2="360" stroke="#353535" stroke-width="2"/>

  <!-- nodes -->
  <g>
    <circle cx="160" cy="360" r="10" fill="#f5f5f7"/>
    <circle cx="380" cy="360" r="10" fill="#f5f5f7"/>
    <circle cx="600" cy="360" r="10" fill="#f5f5f7"/>
    <circle cx="820" cy="360" r="10" fill="#f5f5f7"/>
    <circle cx="1040" cy="360" r="10" fill="#f5f5f7"/>
  </g>

  <!-- labels above -->
  <g text-anchor="middle">
    <text x="160" y="300" fill="#f5f5f7" font-size="18" font-weight="600">Connect</text>
    <text x="380" y="300" fill="#f5f5f7" font-size="18" font-weight="600">First DM</text>
    <text x="600" y="300" fill="#f5f5f7" font-size="18" font-weight="600">Value nudge</text>
    <text x="820" y="300" fill="#f5f5f7" font-size="18" font-weight="600">Offer</text>
    <text x="1040" y="300" fill="#f5f5f7" font-size="18" font-weight="600">Last touch</text>
  </g>
  <!-- day labels below -->
  <g text-anchor="middle" fill="#8e9192" font-size="14">
    <text x="160" y="420">Day 0</text>
    <text x="380" y="420">Day 1</text>
    <text x="600" y="420">Day 3</text>
    <text x="820" y="420">Day 6</text>
    <text x="1040" y="420">Day 9</text>
  </g>

  <text x="64" y="560" fill="#e2e2e2" font-size="16">Stops the moment they reply. Resumes if they go quiet.</text>
  <text x="64" y="592" fill="#8e9192" font-size="14">deduped so the same person is never messaged twice · capped daily per account</text>
</svg>
