<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Recover lost enquiries without chasing</title>
  <desc id="desc">An illustrative model showing one quiet enquiry becoming three honest exits.</desc>
  <rect width="1200" height="675" fill="#f2efe7"/>
  <path d="M54 62H1146M54 614H1146" stroke="#191919" stroke-width="2"/>
  <text x="58" y="92" font-family="monospace" font-size="18" letter-spacing="4" fill="#191919">OWNER-LED DEMAND SYSTEM</text>
  <text x="1140" y="92" text-anchor="end" font-family="monospace" font-size="18" letter-spacing="3" fill="#191919">ISSUE 35 / 2026</text>
  <text x="58" y="205" font-family="Georgia, serif" font-size="67" font-weight="700" fill="#191919">A quiet enquiry</text>
  <text x="58" y="278" font-family="Georgia, serif" font-size="67" font-weight="700" fill="#191919">needs less work.</text>
  <text x="58" y="332" font-family="Arial, sans-serif" font-size="24" fill="#333333">Recover interest with one useful answer and three honest exits.</text>
  <rect x="690" y="150" width="430" height="110" fill="#ef3f2f"/>
  <text x="725" y="198" font-family="monospace" font-size="30" font-weight="700" fill="#ffffff">1 QUIET ENQUIRY</text>
  <text x="725" y="234" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">the buyer stopped replying</text>
  <path d="M905 274V316" stroke="#191919" stroke-width="4"/>
  <path d="M895 307L905 322L915 307" fill="none" stroke="#191919" stroke-width="4"/>
  <rect x="690" y="330" width="430" height="82" fill="#0e9f74"/>
  <text x="725" y="380" font-family="monospace" font-size="28" font-weight="700" fill="#ffffff">1 USEFUL ANSWER</text>
  <path d="M805 425L735 478M905 425V478M1005 425L1075 478" stroke="#191919" stroke-width="4"/>
  <rect x="655" y="500" width="145" height="62" fill="#1e61c8"/>
  <rect x="833" y="500" width="145" height="62" fill="#1e61c8"/>
  <rect x="1010" y="500" width="145" height="62" fill="#1e61c8"/>
  <text x="727" y="538" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#ffffff">SMALLER</text>
  <text x="905" y="538" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#ffffff">LATER</text>
  <text x="1082" y="538" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#ffffff">NOT NOW</text>
  <text x="58" y="555" font-family="monospace" font-size="18" letter-spacing="3" fill="#555555">RECOVERY WITHOUT PRESSURE</text>
</svg>
