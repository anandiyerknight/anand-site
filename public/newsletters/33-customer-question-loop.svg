<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Turn customer questions into sales content</title>
  <desc id="desc">A five-step loop from customer question to useful answer, content, follow-up and learning.</desc>
  <rect width="1200" height="675" fill="#0b0b0b"/>
  <path d="M72 94H1128M72 582H1128" stroke="#353535"/>
  <text x="72" y="72" fill="#a8a8a8" font-family="monospace" font-size="15" letter-spacing="4">AUTOMATION SERIES · ISSUE 33</text>
  <text x="72" y="178" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="67" font-weight="700">Turn customer</text>
  <text x="72" y="254" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="67" font-weight="700">questions into</text>
  <text x="72" y="330" fill="#46e0d0" font-family="Arial, sans-serif" font-size="67" font-weight="700">sales content.</text>
  <text x="72" y="395" fill="#c5c5c5" font-family="Arial, sans-serif" font-size="22">The question loop: collect, answer, adapt, route, learn.</text>
  <g font-family="monospace" font-size="18" font-weight="700">
    <rect x="760" y="150" width="320" height="62" fill="#46e0d0"/><text x="786" y="189" fill="#0b0b0b">01  QUESTION</text>
    <rect x="760" y="228" width="320" height="62" fill="#f3b562"/><text x="786" y="267" fill="#0b0b0b">02  ANSWER</text>
    <rect x="760" y="306" width="320" height="62" fill="#bd83f2"/><text x="786" y="345" fill="#0b0b0b">03  ADAPT</text>
    <rect x="760" y="384" width="320" height="62" fill="#6ea7ff"/><text x="786" y="423" fill="#0b0b0b">04  ROUTE</text>
    <rect x="760" y="462" width="320" height="62" fill="#f07167"/><text x="786" y="501" fill="#0b0b0b">05  LEARN</text>
  </g>
  <text x="72" y="552" fill="#878787" font-family="monospace" font-size="14" letter-spacing="2">ONE USEFUL ANSWER · MANY RELEVANT MOMENTS</text>
</svg>
