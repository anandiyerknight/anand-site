<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The AI-Assisted Marketing System</title>
  <desc id="desc">An illustrative loop from buyer signal to brief, assets, response route and revenue review.</desc>
  <rect width="1200" height="675" fill="#f4efe5"/>
  <path d="M0 74H1200M0 148H1200M0 222H1200M0 296H1200M0 370H1200M0 444H1200M0 518H1200M0 592H1200M74 0V675M148 0V675M222 0V675M296 0V675M370 0V675M444 0V675M518 0V675M592 0V675M666 0V675M740 0V675M814 0V675M888 0V675M962 0V675M1036 0V675M1110 0V675" stroke="#d8d0c2" stroke-width="1" opacity=".55"/>
  <rect x="48" y="42" width="1104" height="591" fill="none" stroke="#161616" stroke-width="4"/>
  <text x="80" y="94" font-family="monospace" font-size="18" letter-spacing="4" fill="#161616">AI-ASSISTED MARKETING SYSTEM</text>
  <text x="80" y="185" font-family="Georgia, serif" font-weight="700" font-size="62" fill="#161616">AI moves faster</text>
  <text x="80" y="252" font-family="Georgia, serif" font-weight="700" font-size="62" fill="#161616">when the system</text>
  <text x="80" y="319" font-family="Georgia, serif" font-weight="700" font-size="62" fill="#ef4b35">knows what matters.</text>
  <text x="80" y="370" font-family="Arial, sans-serif" font-size="22" fill="#4b4b4b">Signal → brief → assets → response route → revenue review</text>
  <g font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="80" y="458" width="174" height="82" fill="#161616"/><text x="167" y="493" fill="#f4efe5">01 SIGNAL</text><text x="167" y="520" fill="#f4efe5" font-size="13">buyer evidence</text>
    <rect x="274" y="458" width="174" height="82" fill="#ef4b35"/><text x="361" y="493" fill="#fff">02 BRIEF</text><text x="361" y="520" fill="#fff" font-size="13">approved claim</text>
    <rect x="468" y="458" width="174" height="82" fill="#13a47b"/><text x="555" y="493" fill="#fff">03 ASSETS</text><text x="555" y="520" fill="#fff" font-size="13">useful output</text>
    <rect x="662" y="458" width="174" height="82" fill="#2d67c8"/><text x="749" y="493" fill="#fff">04 ROUTE</text><text x="749" y="520" fill="#fff" font-size="13">owner + deadline</text>
    <rect x="856" y="458" width="264" height="82" fill="#f2c84b"/><text x="988" y="493" fill="#161616">05 REVIEW</text><text x="988" y="520" fill="#161616" font-size="13">qualified movement</text>
  </g>
  <text x="80" y="591" font-family="monospace" font-size="15" letter-spacing="2" fill="#5b5b5b">ILLUSTRATIVE MODEL · ISSUE 31</text>
</svg>
